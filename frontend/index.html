<!DOCTYPE html>
<html lang="hi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>DHARA</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>

  <!-- Icon set (line icons). Used below with <use href="#i-name">. No emoji, no internet needed. -->
  <svg width="0" height="0" style="position:absolute" aria-hidden="true">
    <defs>
      <symbol id="i-user" viewBox="0 0 24 24"><circle cx="12" cy="8" r="4"/><path d="M4 21c0-4.4 3.6-7 8-7s8 2.6 8 7"/></symbol>
      <symbol id="i-signal" viewBox="0 0 24 24"><path d="M4 20v-4M9 20v-8M14 20V8M19 20V4"/></symbol>
      <symbol id="i-globe" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3c3 3.5 3 14.5 0 18M12 3c-3 3.5-3 14.5 0 18"/></symbol>
      <symbol id="i-chevron" viewBox="0 0 24 24"><path d="M6 9l6 6 6-6"/></symbol>
      <symbol id="i-mic" viewBox="0 0 24 24"><rect x="9" y="2" width="6" height="12" rx="3" fill="currentColor"/><path d="M5 11a7 7 0 0 0 14 0M12 18v4"/></symbol>
      <symbol id="i-leaf" viewBox="0 0 24 24"><path d="M5 19c0-8 5-13 14-14 0 9-5 14-13 14"/><path d="M5 19L14 10"/></symbol>
      <symbol id="i-doc" viewBox="0 0 24 24"><path d="M14 3H7a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V8z"/><path d="M14 3v5h5M9 13h6M9 17h6"/></symbol>
      <symbol id="i-heart" viewBox="0 0 24 24"><path d="M12 21s-8-5.2-8-11a4.5 4.5 0 0 1 8-2.8A4.5 4.5 0 0 1 20 10c0 5.8-8 11-8 11z"/></symbol>
      <symbol id="i-speaker" viewBox="0 0 24 24"><path d="M4 9v6h4l5 4V5L8 9z"/><path d="M16.5 8.5a5 5 0 0 1 0 7M19 6a8.5 8.5 0 0 1 0 12"/></symbol>
      <symbol id="i-pen" viewBox="0 0 24 24"><path d="M12 20h9"/><path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4z"/></symbol>
      <symbol id="i-back" viewBox="0 0 24 24"><path d="M19 12H5M12 19l-7-7 7-7"/></symbol>
      <symbol id="i-phone" viewBox="0 0 24 24"><path d="M22 16.9v3a2 2 0 0 1-2.2 2 19.8 19.8 0 0 1-8.6-3.1 19.5 19.5 0 0 1-6-6A19.8 19.8 0 0 1 2.1 4.2 2 2 0 0 1 4.1 2h3a2 2 0 0 1 2 1.7c.1 1 .4 1.9.7 2.8a2 2 0 0 1-.5 2.1L8.1 9.9a16 16 0 0 0 6 6l1.3-1.3a2 2 0 0 1 2.1-.4c.9.3 1.8.6 2.8.7a2 2 0 0 1 1.7 2z"/></symbol>
      <symbol id="i-pin" viewBox="0 0 24 24"><path d="M12 21s7-6 7-11a7 7 0 0 0-14 0c0 5 7 11 7 11z"/><circle cx="12" cy="10" r="2.5"/></symbol>
      <symbol id="i-alert" viewBox="0 0 24 24"><path d="M12 3l10 18H2z"/><path d="M12 10v5M12 18h.01"/></symbol>
    </defs>
  </svg>

  <!-- Splash screen: shows for 1.5 seconds, then fades away (CSS only) -->
  <div id="splash" class="splash" aria-hidden="true">
    <div class="splash-logo">धारा</div>
    <div class="splash-sub">DHARA</div>
    <div class="spinner"></div>
  </div>

  <div class="app">

    <!-- Two bars at the top, stuck to the top of the screen -->
    <div class="nav">

      <!-- Bar 1: the name, centred, in many colours -->
      <header class="topbar">
        <h1 class="logo">धारा</h1>
      </header>

      <!-- Bar 2: language, role, low-data -->
      <nav class="controls">
        <div class="select-wrap">
          <svg class="ico lead"><use href="#i-globe"/></svg>
          <select id="lang-select" class="ctl" aria-label="Language"></select>
          <svg class="ico chev"><use href="#i-chevron"/></svg>
        </div>
        <button id="role-btn" class="ctl" type="button">
          <svg class="ico"><use href="#i-user"/></svg>
          <span id="role-label">किसान</span>
        </button>
        <button id="lowdata-btn" class="ctl" type="button">
          <svg class="ico"><use href="#i-signal"/></svg>
          <span id="lowdata-label">कम डेटा: बंद</span>
        </button>
      </nav>
    </div>

    <!-- HOME SCREEN -->
    <main id="screen-home" class="screen">
      <p id="home-title" class="home-title">बोलकर पूछिए</p>

      <div class="mic-wrap">
        <button id="mic-btn" class="mic-btn" type="button" aria-label="Microphone">
          <svg class="ico"><use href="#i-mic"/></svg>
        </button>
        <p id="mic-label" class="mic-label">दबाकर बोलिए</p>
        <p id="status" class="status" aria-live="polite"></p>
      </div>

      <div class="topics">
        <button class="topic" type="button" data-topic="crops">
          <span class="badge"><svg class="ico"><use href="#i-leaf"/></svg></span>
          <span data-i18n="crops">फसल</span>
        </button>
        <button class="topic" type="button" data-topic="schemes">
          <span class="badge"><svg class="ico"><use href="#i-doc"/></svg></span>
          <span data-i18n="schemes">योजनाएँ</span>
        </button>
        <button class="topic" type="button" data-topic="health">
          <span class="badge"><svg class="ico"><use href="#i-heart"/></svg></span>
          <span data-i18n="health">स्वास्थ्य</span>
        </button>
      </div>
    </main>

    <!-- ANSWER SCREEN -->
    <section id="screen-answer" class="screen hidden">
      <div id="answer-card" class="card">
        <p id="answer-transcript" class="transcript"></p>
        <p id="answer-text" class="answer-text"></p>
        <button id="play-btn" class="big-btn blue" type="button">
          <svg class="ico"><use href="#i-speaker"/></svg> <span id="play-label">सुनिए</span>
        </button>
        <p id="answer-source" class="source"></p>
        <p id="answer-refused" class="refused hidden"></p>
        <button id="offer-btn" class="big-btn green hidden" type="button">
          <svg class="ico"><use href="#i-pen"/></svg> <span id="offer-label">आवेदन तैयार करें</span>
        </button>
      </div>
      <button id="back-btn" class="big-btn navy" type="button">
        <svg class="ico"><use href="#i-back"/></svg> <span id="back-label">वापस</span>
      </button>
    </section>

    <!-- EMERGENCY SCREEN (no chat text, only what is needed) -->
    <section id="screen-emergency" class="screen hidden emergency">
      <p id="em-message" class="em-message"></p>
      <p id="em-number" class="em-number"></p>
      <a id="em-call" class="call-btn" href="#">
        <svg class="ico"><use href="#i-phone"/></svg>
        <span id="em-call-label">फ़ोन करें</span>
      </a>
      <div class="em-hospital">
        <p id="em-hospital-name" class="em-hospital-name"></p>
        <p id="em-hospital-dist" class="em-hospital-dist"></p>
        <a id="em-maps" class="big-btn blue" href="#" target="_blank" rel="noopener">
          <svg class="ico"><use href="#i-pin"/></svg> <span id="em-maps-label">नक्शे में खोलें</span>
        </a>
      </div>
      <p id="em-safety" class="em-safety"></p>
      <button id="em-back" class="big-btn navy" type="button">
        <svg class="ico"><use href="#i-back"/></svg> <span id="em-back-label">वापस</span>
      </button>
    </section>

    <!-- Red SOS button, always visible -->
    <button id="sos-btn" class="sos-btn" type="button">
      <svg class="ico"><use href="#i-alert"/></svg> <span id="sos-label">आपातकाल</span>
    </button>

  </div>

  <!-- Order matters: settings, fake backend, then the main code -->
  <script src="config.js"></script>
  <script src="mock-api.js"></script>
  <script src="app.js"></script>
</body>
</html>
